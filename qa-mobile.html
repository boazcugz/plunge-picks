        &lt;details id=&quot;the-math&quot; class=&quot;method&quot;&gt;&lt;summary&gt;Peek at the cool science &lt;span aria-hidden=&quot;true&quot;&gt;＋&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;method-grid&quot;&gt;&lt;div&gt;&lt;h3&gt;Ice shower calculation&lt;/h3&gt;&lt;p&gt;Water use = flow × run time. Continuous cooling power = (flow in L/min ÷ 60) × 4.186 × (tap °C − target °C), in kW. Water is approximated as 1 kg/L. Heat removed = water liters × 4.186 × temperature drop, in kJ.&lt;/p&gt;&lt;p&gt;This is thermal cooling duty, not electrical consumption or a product rating. The ideal estimate excludes heat gains and equipment losses; actual output depends on operating conditions. It does not calculate a safe exposure time.&lt;/p&gt;&lt;p&gt;Based on &lt;a href=&quot;https://openstax.org/books/college-physics-2e/pages/14-2-temperature-change-and-heat-capacity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OpenStax’s heat-capacity relationship&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Ice calculation&lt;/h3&gt;&lt;p&gt;We balance the heat lost by the water against the energy needed to warm the ice to 0°C, melt it, and warm the meltwater to your target. Water is approximated as 1 kg per liter. Leave room for that extra water.&lt;/p&gt;&lt;p&gt;m = V × 4.186 × (Tstart − Ttarget) ÷ [2.09 × (−Tice) + 334 + 4.186 × Ttarget]. Temperatures in °C; mass in kg.&lt;/p&gt;&lt;p&gt;Constants: water 4.186 and ice 2.09 kJ/kg·°C; melting 334 kJ/kg. &lt;a href=&quot;https://openstax.org/books/college-physics-2e/pages/14-2-temperature-change-and-heat-capacity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Heat capacity reference&lt;/a&gt; · &lt;a href=&quot;https://openstax.org/books/college-physics-2e/pages/14-3-phase-change-and-latent-heat&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Melting reference&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Cost comparison&lt;/h3&gt;&lt;p&gt;Ice cost = sessions/week × 52 × bags/session × bag price. Chiller running cost = daily kWh × 365 × electricity price + 12 × monthly upkeep.&lt;/p&gt;&lt;p&gt;We add your setup cost once. Simple payback divides it by the monthly operating savings. It assumes year-round use and excludes financing, resale, repairs beyond entered upkeep, and the value of your time.&lt;/p&gt;&lt;p&gt;Setup suggestions use the preferences you select. Before choosing equipment, check tub volume, insulation, ambient conditions, cooling time, compatibility and the manufacturer’s ratings.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
