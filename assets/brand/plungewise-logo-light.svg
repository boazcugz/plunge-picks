      <path d="M0,-58 L7,-44 L0,-47 L-7,-44 Z" fill="#0B2D46"/>
      <path d="M58,0 L44,7 L47,0 L44,-7 Z" fill="#0B2D46"/>
      <path d="M0,58 L-7,44 L0,47 L7,44 Z" fill="#0B2D46"/>
      <path d="M-58,0 L-44,-7 L-47,0 L-44,7 Z" fill="#0B2D46"/>
      <defs>
        <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
