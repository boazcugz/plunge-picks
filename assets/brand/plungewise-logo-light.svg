<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">PlungeWise logo</title>
  <desc id="desc">PlungeWise logo for light backgrounds, with a compass and water droplet symbol.</desc>
  <g transform="translate(55 52) scale(2)">
    
    <g transform="translate(64 64)">
