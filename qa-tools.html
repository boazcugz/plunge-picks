&lt;h2 id=&quot;example-title&quot;&gt;A calculation you can check.&lt;/h2&gt;

&lt;div class=&quot;table-scroll&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Ice quantity examples, scroll if needed&quot;&gt;&lt;table&gt;

&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;table-note&quot;&gt;Ideal estimates, not measured tub performance. Meltwater uses calculated mass, not rounded bags. A warm tub, sunlight and air can increase ice needs.&lt;/p&gt;
&lt;details class=&quot;method&quot;&gt;&lt;summary&gt;How the ice calculation works&lt;/summary&gt;
&lt;p&gt;Heat lost by the water warms the ice to 0°C, melts it, then warms the meltwater to your target. Water is approximated as 1 kg per liter.&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;Ice kg = water liters × 4.186 × (start °C − target °C) ÷ [2.09 × (−ice °C) + 334 + 4.186 × target °C]&lt;/p&gt;
&lt;p&gt;Constants: water heat capacity 4.186 and ice heat capacity 2.09 kJ/kg·°C; heat of fusion 334 kJ/kg. Sources: OpenStax on &lt;a href=&quot;https://openstax.org/books/college-physics-2e/pages/14-2-temperature-change-and-heat-capacity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;heat capacity&lt;/a&gt; and &lt;a href=&quot;https://openstax.org/books/college-physics-2e/pages/14-3-phase-change-and-latent-heat&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;melting and latent heat&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;The model excludes heat from your body, container, air and sun. It does not calculate cooling time, cold retention or a suitable exposure temperature. It does not apply directly to sealed ice packs or frozen bottles.&lt;/p&gt;
&lt;/details&gt;

&lt;button class=&quot;calculate&quot; type=&quot;submit&quot;&gt;Compare my costs&lt;/button&gt;
&lt;/form&gt;
&lt;aside id=&quot;tool-result&quot; class=&quot;tool-result&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot; aria-label=&quot;Cost comparison&quot; tabindex=&quot;-1&quot;&gt;
&lt;p class=&quot;result-kicker&quot;&gt;EXAMPLE RESULT · 12 MONTHS&lt;/p&gt;&lt;h2 class=&quot;result-title&quot;&gt;The chiller costs less here.&lt;/h2&gt;&lt;div class=&quot;metric-value&quot;&gt;$609&lt;/div&gt;&lt;p class=&quot;result-lead&quot;&gt;Estimated difference over 12 months, including the $1,200 chiller setup.&lt;/p&gt;
&lt;div class=&quot;result-grid&quot;&gt;&lt;div class=&quot;result-stat&quot;&gt;&lt;strong&gt;$173.33&lt;/strong&gt;&lt;span&gt;Monthly bagged ice&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;result-stat&quot;&gt;&lt;strong&gt;$22.60&lt;/strong&gt;&lt;span&gt;Monthly chiller running cost&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;result-stat&quot;&gt;&lt;strong&gt;$2,080&lt;/strong&gt;&lt;span&gt;Ice total over 12 months&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;result-stat&quot;&gt;&lt;strong&gt;$1,471.20&lt;/strong&gt;&lt;span&gt;Chiller setup + 12 months running cost&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;result-note&quot;&gt;Simple chiller payback: about 8.0 months at these example inputs. Your prices and routine may favor ice instead.&lt;/p&gt;
&lt;/aside&gt;
&lt;/section&gt;
&lt;noscript&gt;&lt;p class=&quot;noscript-note&quot;&gt;The interactive calculator needs JavaScript. The worked example and table below remain available.&lt;/p&gt;&lt;/noscript&gt;
&lt;section class=&quot;content-section&quot; aria-labelledby=&quot;example-title&quot;&gt;
&lt;h2 id=&quot;example-title&quot;&gt;What the example adds up to.&lt;/h2&gt;
&lt;p&gt;Four plunges a week, two $5 bags per plunge: &lt;strong&gt;$2,080 a year in ice&lt;/strong&gt;. A chiller using 3 kWh/day at $0.16/kWh, plus $8 monthly upkeep, costs &lt;strong&gt;$271.20 a year to run&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;worked-example&quot;&gt;&lt;h3&gt;Add setup cost before comparing.&lt;/h3&gt;&lt;p&gt;With an illustrative &lt;strong&gt;$1,200 setup&lt;/strong&gt;, the chiller’s first-year total is &lt;strong&gt;$1,471.20&lt;/strong&gt;: $608.80 less than ice at these inputs. Simple payback is about &lt;strong&gt;8.0 months&lt;/strong&gt;. These are examples, not a product price or performance claim.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;table-scroll&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Annual cost examples, scroll if needed&quot;&gt;&lt;table&gt;
&lt;caption&gt;Change frequency, keep the other example inputs fixed.&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Plunges / week&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Yearly ice&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Chiller setup + year one&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Lower total&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;1&lt;/th&gt;&lt;td&gt;$520.00&lt;/td&gt;&lt;td&gt;$1,471.20&lt;/td&gt;&lt;td&gt;Ice by $951.20&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;4&lt;/th&gt;&lt;td&gt;$2,080.00&lt;/td&gt;&lt;td&gt;$1,471.20&lt;/td&gt;&lt;td&gt;Chiller by $608.80&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;7&lt;/th&gt;&lt;td&gt;$3,640.00&lt;/td&gt;&lt;td&gt;$1,471.20&lt;/td&gt;&lt;td&gt;Chiller by $2,168.80&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;table-note&quot;&gt;Two $5 bags/plunge; $1,200 setup; 3 kWh/day; $0.16/kWh; $8/month upkeep. Holding chiller energy fixed is an illustration, not a claim that every routine uses the same energy.&lt;/p&gt;
&lt;details class=&quot;method&quot;&gt;&lt;summary&gt;How costs and payback are calculated&lt;/summary&gt;
&lt;p class=&quot;formula&quot;&gt;Annual ice = plunges/week × 52 × bags/plunge × bag price.&lt;br&gt;Annual chiller running cost = daily kWh × 365 × electricity price + monthly upkeep × 12.&lt;/p&gt;
&lt;p&gt;Totals scale the annual costs to your chosen months, adding the chiller setup cost once.&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;Simple payback in months = setup cost ÷ [(annual ice cost − annual chiller running cost) ÷ 12].&lt;/p&gt;
&lt;p&gt;If chiller operation costs as much as or more than ice, there is no operating-cost payback. An eventual payback does not mean the chiller is cheaper within your chosen period.&lt;/p&gt;
&lt;p&gt;Assumes year-round use and constant inputs. Excludes common tub and water costs, financing, resale, repairs beyond entered upkeep, and the value of your time. If the routes need differently priced tubs or other extra equipment, include that difference in the setup amount.&lt;/p&gt;
&lt;/details&gt;
&lt;details class=&quot;method&quot;&gt;&lt;summary&gt;Where do my ice and energy numbers come from?&lt;/summary&gt;&lt;p&gt;Use the &lt;a href=&quot;/ice-bath-calculator&quot;&gt;ice bath calculator&lt;/a&gt; for a fresh cooling cycle. An already-cold tub may need less on its next use. Daily chiller energy is best based on measured kWh over a representative day: rated watts alone do not capture cycling, pumps, climate or insulation.&lt;/p&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;section class=&quot;content-section&quot; aria-labelledby=&quot;next-title&quot;&gt;
&lt;h2 id=&quot;next-title&quot;&gt;Compare the gear behind the numbers.&lt;/h2&gt;
&lt;p&gt;A cost result is a planning aid, not a product recommendation. Check fit, capacity and package contents.&lt;/p&gt;
